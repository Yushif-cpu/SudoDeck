<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#00f0ff" flood-opacity="0.8"/>
    </filter>
    <linearGradient id="cursorGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <!-- Terminal Chevron: > (Crisp White) -->
  <path
    d="M 10 14 L 29 32 L 10 50"
    fill="none"
    stroke="#ffffff"
    stroke-width="8"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Terminal Cursor: _ (Electric Neon Cyan-Emerald Gradient with Glow) -->
  <rect
    x="33"
    y="43"
    width="23"
    height="8"
    rx="4"
    fill="url(#cursorGrad)"
    filter="url(#glow)"
  />
</svg>
